name: Run Terraform Plan and Raise PR

on:
    push:
      branches: [ "dev" ]

env:
  AWS_REGION: ap-south-2      

permissions:
  id-token: write 
  contents: write
  pull-requests: write 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
            role-to-assume: arn:aws:iam::778477254970:role/gha-oidc-role
            aws-region: ${{ env.AWS_REGION }}

      - name: Test AWS Session
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color > plan.txt
    
      - name: Open or update PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --base main --state open --json number -q '.[0].number')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body-file plan.txt
          else
            gh pr create --head "$GITHUB_REF_NAME" --base main \
              --title "Terraform changes from $GITHUB_REF_NAME" \
              --body-file plan.txt
          fi